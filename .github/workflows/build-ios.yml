name: Build iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      # Сборка без подписи: проверяет, что приложение и виджет компилируются.
      - run: flutter build ios --release --no-codesign
      # Неподписанный .ipa для установки через Sideloadly/AltStore со своим Apple ID.
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr xuezi-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: xuezi-ios
          path: xuezi-unsigned.ipa
